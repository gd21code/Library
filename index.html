<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Book List</h1>
    <div id="new-book">
        <button id="book-btn">New Book</button>
    </div>
    <div class="form-container">
        <form id="book-form" style="display:none;">
            <div>
                <label for="title">Title:</label><br>
                <input type="text" id="title" name="title">
            </div>
            <div>
                <label for="author">Author:</label><br>
                <input type="text" id="author" name="author">
            </div>
            <div>
                <label for="pages"># of pages:</label><br>
                <input type="text" id="pages" name="pages">
            </div>
            <div>
                <label for="read">Read Status:</label><br>
                <input type="checkbox" id="read" name="read">
            </div>
            <div class="submit-book">
                <input id="submit-btn" type="submit" value="Add Book">
            </div> 
        </form>
    </div>
    <div id="card-space"></div>
    <script src="script.js"></script>
</body>
</html>
